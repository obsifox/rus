[package]
name = "launcher"
version = "0.2.28"
edition = "2021"
autobins = false
description = "Rus — a Minecraft: Java Edition launcher written in Rust"

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[[bin]]
name = "rus"
path = "src/main.rs"
