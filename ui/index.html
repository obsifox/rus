<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rus Environment</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="env">
  <header class="envbar">
    <div class="env-brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 3 29 10v12L16 29 3 22V10z" fill="#161616" stroke="currentColor" stroke-width="1.4"/>
        <path d="M16 3 29 10 16 17 3 10z" fill="#222" stroke="currentColor" stroke-width="1.4"/>
        <path d="M16 17v12" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <span class="env-name">RUS</span>
      <span class="env-kind">Environment</span>
    </div>
    <div class="env-title" id="envTitle">Sandbox idle</div>
    <div class="env-seal" id="envSeal">
      <i></i>
      <span>Sandbox</span>
    </div>
  </header>

  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 3 29 10v12L16 29 3 22V10z" fill="#161616" stroke="currentColor" stroke-width="1.4"/>
          <path d="M16 3 29 10 16 17 3 10z" fill="#222" stroke="currentColor" stroke-width="1.4"/>
          <path d="M16 17v12" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        <div>
          <div class="brand-name">RUS</div>
          <div class="brand-sub">SANDBOX · 1.1</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-btn is-active" data-tab="home">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 7 8 2l6 5v7H2z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 14V9h4v5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-btn" data-tab="version">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6 14.4 5v6L8 14.4 1.6 11V5z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1.6 5 8 8.4 14.4 5M8 8.4v6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Versions</span>
        </button>
        <button class="nav-btn" data-tab="mods">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h4v4H3zM9 3h4v4H9zM3 9h4v4H3zM9 9h4v4H9z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Mods</span>
        </button>
        <button class="nav-btn" data-tab="settings">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 5.4A2.6 2.6 0 1 0 8 10.6 2.6 2.6 0 0 0 8 5.4z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8 3.1 12.9" stroke="currentColor" stroke-width="1.4"/></svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="side-foot">
        <button class="account" id="accountChip" type="button">
          <canvas id="sideHead" class="head" data-head width="64" height="64"></canvas>
          <div class="account-meta">
            <div class="side-name" id="sideName">Player</div>
            <div class="side-tag">Local account</div>
          </div>
        </button>

        <div class="seal-line" id="sealLine">Sandbox</div>

        <div class="engine-label">Launch with</div>
        <div class="engine" id="engineToggle">
          <button type="button" class="engine-btn is-on" data-engine="vanilla">Vanilla</button>
          <button type="button" class="engine-btn" data-engine="horizon">Horizon</button>
        </div>
        <div class="engine-note" id="engineNote">Official client · sandboxed</div>

        <div class="launch-ver">
          <span>Selected</span>
          <strong id="selectedVersion">—</strong>
        </div>
        <button class="play" id="playBtn" type="button">Play</button>
        <div class="launch-status" id="launchStatus">Starts in the sandbox</div>
      </div>
    </aside>

    <main class="content" id="view"></main>
  </div>

  <footer class="envfoot">
    <span class="env-root" id="envRoot">Private profile</span>
    <span class="env-policy" id="envPolicy">Dies with Rus</span>
  </footer>
</div>
<div id="toasts" class="toasts"></div>
<div id="overlay" class="overlay hidden"></div>
<script src="/app.js"></script>
</body>
</html>
